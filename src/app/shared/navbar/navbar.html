<nav class="navbar">

  <!-- Logo -->
  <div class="logo">
    MediCare
  </div>


  <!-- Navigation -->
  <div class="nav-links">

    <!-- ========================= -->
    <!-- PATIENT NAVIGATION -->
    <!-- ========================= -->

    <a
      *ngIf="authService.isPatient()"
      [routerLink]="doctorsRoute"
      routerLinkActive="active">

      <i class="pi pi-user"></i>

      Doctors

    </a>


    <a
      *ngIf="authService.isPatient()"
      [routerLink]="patientAppointmentsRoute"
      routerLinkActive="active">

      <i class="pi pi-calendar"></i>

      My Appointments

    </a>


    <!-- ========================= -->
    <!-- DOCTOR NAVIGATION -->
    <!-- ========================= -->

    <a
      *ngIf="authService.isDoctor()"
      [routerLink]="doctorDashboardRoute"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">

      <i class="pi pi-home"></i>

      Dashboard

    </a>


    <a
      *ngIf="authService.isDoctor()"
      [routerLink]="doctorAvailabilityRoute"
      routerLinkActive="active">

      <i class="pi pi-calendar"></i>

      My Availability

    </a>


    <a
      *ngIf="authService.isDoctor()"
      [routerLink]="doctorAppointmentsRoute"
      routerLinkActive="active">

      <i class="pi pi-calendar-clock"></i>

      My Appointments

    </a>


    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <a
      *ngIf="!authService.isLoggedIn()"
      [routerLink]="loginRoute"
      routerLinkActive="active">

      <i class="pi pi-sign-in"></i>

      Login

    </a>

  </div>


  <!-- ========================= -->
  <!-- USER SECTION -->
  <!-- ========================= -->

  <div class="user-section">

    <span
      *ngIf="authService.isLoggedIn()"
      class="user-name">

      {{ authService.getUser()?.name }}

    </span>


    <button
      *ngIf="authService.isLoggedIn()"
      class="logout-button"
      type="button"
      (click)="logout()">

      Logout

    </button>

  </div>

</nav>
